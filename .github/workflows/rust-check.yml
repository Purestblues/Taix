name: Rust check

# 只做「能不能编译 + 单测过不过」，不产出任何东西。
#
# 为什么需要它：本机没有 MSVC 链接器，`cargo build/test` 会调到 MSYS 的 `link.exe` 然后失败，
# 所以 shijian-server / shijian-monitor-windows 的改动在本地无法验证。改完推上来手动跑一次，
# 五分钟左右就能看到编译错误，比等发版的 10 分钟打包再炸掉划算。
#
# 手动触发：gh workflow run rust-check.yml -R Purestblues/shijian

on:
  workflow_dispatch:

jobs:
  # 服务端在 Linux 上编不过（`constants::default_data_dir` 只有 windows / macos 两个分支），
  # 所以跑在 windows-latest 上——这也正是发版机器，口径一致。
  server:
    name: shijian-server (test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shijian-server

      - name: cargo test
        run: cargo test --manifest-path shijian-server/Cargo.toml --locked

  monitor-windows:
    name: shijian-monitor-windows (cargo check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          rustflags: ""

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shijian-monitor-windows

      - name: cargo check
        run: cargo check --manifest-path shijian-monitor-windows/Cargo.toml --locked
